<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quiniela NFL 2026 — Iniciar sesión</title>
<link rel="icon" href="img/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" style="display:flex;align-items:center;gap:16px;text-decoration:none;">
      <img src="img/logo.png" alt="Logo Quiniela NFL 2026" />
      <div class="wordmark">Quiniela <span>NFL 2026</span></div>
    </a>
  </div>
</header>

<section class="block" style="border-top:none;">
  <div class="wrap">
    <div style="max-width: 440px; margin: 30px auto 0;">
      <div class="block-head" style="justify-content:center;">
        <h2>Iniciar sesión</h2>
      </div>

      <form class="ticket" id="form-login" novalidate>
        <div class="field">
          <label for="correo">Correo electrónico</label>
          <input type="email" id="correo" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn-primary" id="login-btn">Entrar</button>
        <p class="form-note">
          <a href="#" id="link-reset">¿Olvidaste tu contraseña?</a>
        </p>
        <div id="form-status" role="status" aria-live="polite"></div>
      </form>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">Quiniela NFL 2026</div>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/login.js"></script>
</body>
</html>
