<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quiniela NFL 2026 — Define tu contraseña</title>
<link rel="icon" href="../img/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../css/styles.css" />
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <img src="../img/logo.png" alt="Logo Quiniela NFL 2026" />
    <div class="wordmark">Quiniela <span>NFL 2026</span></div>
  </div>
</header>

<section class="block" style="border-top:none;">
  <div class="wrap">
    <div style="max-width: 460px; margin: 20px auto 0;">
      <div class="block-head" style="justify-content:center;">
        <h2>Define tu contraseña</h2>
      </div>
      <p style="text-align:center;color:var(--cream-dim);margin-top:-14px;margin-bottom:26px;font-size:14.5px;" id="saludo">
        Entraste con una contraseña temporal. Antes de continuar, define la que vas a usar el resto de la temporada.
      </p>

      <form class="ticket" id="form-cambiar" novalidate>
        <div class="field">
          <label for="password1">Nueva contraseña</label>
          <input type="password" id="password1" required autocomplete="new-password" minlength="8" />
        </div>
        <div class="field">
          <label for="password2">Confirmar contraseña</label>
          <input type="password" id="password2" required autocomplete="new-password" minlength="8" />
        </div>
        <p class="form-note" style="text-align:left;margin-top:-6px;margin-bottom:18px;">
          Mínimo 8 caracteres.
        </p>
        <button type="submit" class="btn-primary" id="submit-btn">Guardar y entrar a la Quiniela</button>
        <div id="form-status" role="status" aria-live="polite"></div>
      </form>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">Quiniela NFL 2026</div>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/auth-guard.js"></script>
<script src="../js/cambiar-password.js"></script>
</body>
</html>
