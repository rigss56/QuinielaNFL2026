<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quiniela NFL 2026 — Mi Quiniela</title>
<link rel="icon" href="../img/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../css/styles.css" />
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <img src="../img/logo.png" alt="Logo Quiniela NFL 2026" />
    <div class="wordmark">Quiniela <span>NFL 2026</span></div>
  </div>
</header>

<section class="block" style="border-top:none;padding-bottom:0;">
  <div class="wrap" id="nav-mount"></div>
</section>

<section class="block" style="border-top:none;padding-top:0;padding-bottom:20px;">
  <div class="wrap" style="display:flex;justify-content:flex-end;">
    <span id="user-bar" style="font-size:13px;color:var(--cream-dim);"></span>
  </div>
</section>

<section class="block" style="border-top:none;">
  <div class="wrap">
    <div class="block-head">
      <span class="tag" id="tag-semana">Semana 1</span>
      <h2>Mi Quiniela</h2>
    </div>

    <div class="week-picker">
      <span style="font-size:13px;color:var(--cream-dim);">Solo puedes ver y jugar la semana en curso.</span>
    </div>

    <div id="lock-banner" style="display:none;" class="lock-banner"></div>
    <div id="sin-partidos" class="callout" style="display:none;">
      Todavía no hay partidos cargados para esta semana. Un administrador los agrega desde
      Firebase (panel de Admin en construcción — Fase 6).
    </div>

    <div id="partidos-container"></div>

    <div class="save-bar" id="save-bar" style="display:none;">
      <div class="wrap" style="padding:0;display:flex;align-items:center;gap:16px;">
        <button class="btn-primary" id="btn-guardar" style="width:auto;padding:13px 28px;">Guardar pronósticos</button>
        <span id="save-status" style="font-size:13px;color:var(--cream-dim);"></span>
      </div>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">Quiniela NFL 2026</div>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/auth-guard.js"></script>
<script src="../js/nav.js"></script>
<script src="../js/calendario-temporada.js"></script>
<script src="../js/quiniela.js"></script>
</body>
</html>
